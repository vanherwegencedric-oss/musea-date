<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Voor Ella 💗</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Zet je mp3 in dezelfde map en noem hem muziek.mp3 (mag ook weg) -->
    <audio id="bg-music" loop preload="auto">
        <source src="muziek.mp3" type="audio/mpeg">
    </audio>

    <button id="music-toggle" aria-label="Muziek aan of uit">🔇</button>

    <div id="loading-screen">
        <div class="loading-heart">💗</div>
        <p>Even iets leuks voorbereiden...</p>
    </div>

    <!-- Alle schermen worden door script.js in dit vak gezet -->
    <div class="container" id="app"></div>

    <script src="script.js"></script>
</body>
</html>
